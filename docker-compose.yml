services:
  postgres:
    image: postgres:16-alpine
    container_name: dermai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dermai_production}
      POSTGRES_USER: ${POSTGRES_USER:-dermai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_strong_password_in_env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dermai_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dermai_admin} -d ${POSTGRES_DB:-dermai_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: dermai-backend:test
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dermai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-dermai_production_secret_key_change_me_please}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dermai_admin}:${POSTGRES_PASSWORD:-change_this_strong_password_in_env}@postgres:5432/${POSTGRES_DB:-dermai_production}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      PYTHONPATH: ${PYTHONPATH:-/app:/app/backend}
    volumes:
      - persistent_uploads:/app/backend/uploads
      - ./backend:/app/backend
      - ./ml_models:/app/ml_models:ro
    networks:
      - dermai_internal
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: dermai-frontend:test
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: dermai_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - dermai_internal

volumes:
  postgres_data:
  persistent_uploads:

networks:
  dermai_internal:
    driver: bridge
